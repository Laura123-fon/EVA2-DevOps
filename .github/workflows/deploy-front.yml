name: Deploy Frontend

on:
  push:
    branches:
      - deploy
    paths:
      - 'front_despacho/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build imagen frontend
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest \
          ./front_despacho

      - name: Push imagen frontend
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest

      - name: Deploy EC2 Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_FRONT_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest

            docker stop front-despacho || true
            docker rm front-despacho || true

            docker run -d \
              --name front-despacho \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest

            docker image prune -f