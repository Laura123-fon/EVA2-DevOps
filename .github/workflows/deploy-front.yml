name: Deploy Frontend

on:
  push:
    branches:
      - deploy
    paths:
      - 'front_despacho/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen frontend
        run: |
          docker build -t ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest ./front_despacho

      - name: Push imagen frontend
        run: |
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

      - name: Deploy EC2 Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_FRONT_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

            sudo docker stop front-despacho || true
            sudo docker rm front-despacho || true

            sudo docker run -d \
              --name front-despacho \
              -p 80:80 \
              ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

            sudo docker image prune -f