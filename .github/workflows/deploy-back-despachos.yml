name: Deploy Back Despachos

on:
  push:
    branches:
      - deploy
    paths:
      - 'back-Despachos_SpringBoot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen
        run: |
          docker build -t ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest ./back-Despachos_SpringBoot

      - name: Push imagen
        run: |
          docker push ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest

      - name: Deploy EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_DESPACHOS_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest

            sudo docker stop back-despachos || true
            sudo docker rm back-despachos || true

            sudo docker run -d \
              --name back-despachos \
              -p 8081:8080 \
              ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest

            sudo docker image prune -f