version: "3.8"

services:
  frontend:
    build: ./proyecto semestral/front_despacho
    container_name: tienda-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-ventas
      - backend-despachos

  backend-ventas:
    build: ./proyecto semestral/back-Ventas_SpringBoot/Springboot-API-REST
    container_name: backend-ventas
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tienda_perritos
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin123
    ports:
      - "8081:8080"
    depends_on:
      - db

  backend-despachos:
    build: ./proyecto semestral/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: backend-despachos
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tienda_perritos
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin123
    ports:
      - "8082:8080"
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: tienda-db
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: tienda_perritos
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: